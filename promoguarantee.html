<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Онлайн-школа «ОТ и ДО» — новый адрес otidoschool.ru</title>

<!-- Для поисковика: настоящая страница живёт здесь. -->
<link rel="canonical" href="https://otidoschool.ru/promo-guarantee.html">
<!-- Для браузера без JavaScript: мгновенный переход. -->
<meta http-equiv="refresh" content="0; url=https://otidoschool.ru/promo-guarantee.html">
<meta name="description" content="Онлайн-школа «ОТ и ДО» переехала на otidoschool.ru">

<style>
  :root {
    --bg: #faf7f2; --paper: #fffdfa; --ink: #201d1a;
    --muted: #655f57; --accent: #b24920; --line: rgba(32,29,26,0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.5;
  }
  .box {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 20px; padding: 40px; max-width: 460px; text-align: center;
  }
  .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
  .logo i { font-style: normal; color: var(--accent); }
  .sub {
    font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--muted); margin-top: 4px;
  }
  p { margin-top: 24px; color: var(--muted); }
  .go {
    display: inline-block; margin-top: 24px; padding: 15px 28px;
    background: var(--accent); color: var(--paper);
    border-radius: 12px; text-decoration: none; font-weight: 700;
  }
  .go:hover { background: #8f3a19; }
  .small { font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">ОТ <i>и</i> ДО</div>
    <div class="sub">онлайн-школа</div>
    <p>Сайт школы переехал на новый адрес.</p>
    <a class="go" href="https://otidoschool.ru/promo-guarantee.html">Перейти на otidoschool.ru</a>
    <p class="small">Если страница не открылась сама, нажмите кнопку выше.</p>
  </div>
  <script>
    // replace, а не href: иначе кнопка «назад» возвращала бы сюда по кругу.
    location.replace("https://otidoschool.ru/promo-guarantee.html");
  </script>
</body>
</html>
